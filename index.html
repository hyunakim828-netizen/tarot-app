<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />

  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://ads-partners.coupang.com/g.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Noto+Serif+KR:wght@400;600;700&family=Pretendard:wght@300;400;600;700&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, sans-serif;
      background: radial-gradient(circle at top, #1e1338 0%, #0d081d 60%, #070410 100%);
      color: #f3e8ff;
      min-height: 100vh;
      overflow-x: hidden;
    }
    .serif { font-family: 'Noto Serif KR', serif; }
    .tarot-num { font-family: 'Cinzel', 'Noto Serif KR', serif; }
    .gold-text {
      background: linear-gradient(135deg, #fde68a 0%, #f59e0b 50%, #fef08a 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .gold-border { border: 1px solid rgba(251, 191, 36, 0.35); }
    .glass-card {
      background: rgba(28, 18, 54, 0.68);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(216, 180, 254, 0.18);
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.45);
    }
    .card-3d {
      perspective: 1000px;
    }
    .card-inner {
      position: relative;
      width: 100%;
      height: 100%;
      transition: transform 0.7s cubic-bezier(0.4, 0.2, 0.2, 1);
      transform-style: preserve-3d;
      transform: rotateY(0deg);
    }
    .card-flipped .card-inner {
      transform: rotateY(180deg);
    }
    .card-face {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      -webkit-backface-visibility: hidden;
      backface-visibility: hidden;
      border-radius: 0.75rem;
    }
    .card-back {
      background: linear-gradient(155deg, #270e4f 0%, #16082e 55%, #0c041a 100%);
      border: 1px solid #d97706;
      box-shadow: inset 0 0 0 1.5px rgba(251, 191, 36, 0.22), 0 4px 10px rgba(0, 0, 0, 0.45);
      z-index: 2;
    }
    .card-front {
      background: linear-gradient(180deg, #faf3e0 0%, #efe1be 100%);
      color: #1e1b4b;
      border: 2px solid #b45309;
      box-shadow: inset 0 0 0 2px #fffbeb, 0 10px 24px rgba(0, 0, 0, 0.55);
      transform: rotateY(180deg);
      z-index: 1;
    }
    .slot-front {
      background: linear-gradient(180deg, #faf3e0 0%, #efe1be 100%);
      color: #1e1b4b;
      border: 2px solid #b45309;
      box-shadow: inset 0 0 0 2px #fffbeb, 0 8px 20px rgba(0, 0, 0, 0.45);
      border-radius: 0.75rem;
    }
    @keyframes float {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-6px); }
    }
    .floating { animation: float 3.5s ease-in-out infinite; }
    .shimmer-btn {
      background: linear-gradient(90deg, #d97706, #f59e0b, #fbbf24, #d97706);
      background-size: 200% auto;
      animation: shimmer 3s linear infinite;
    }
    @keyframes shimmer { to { background-position: 200% center; } }

    @keyframes dynamicShuffle {
      0% {
        transform: translate(0, 0) rotate(0deg) scale(1);
        filter: brightness(1);
      }
      35% {
        transform: translate(var(--tx, 0px), var(--ty, 0px)) rotate(var(--rot, 18deg)) scale(0.76);
        filter: brightness(1.35);
        border-color: #fde68a;
        box-shadow: 0 0 16px rgba(251, 191, 36, 0.55);
      }
      65% {
        transform: translate(calc(var(--tx, 0px) * -0.45), calc(var(--ty, 0px) * -0.45)) rotate(calc(var(--rot, 18deg) * -0.85)) scale(1.12);
        filter: brightness(1.2);
      }
      85% {
        transform: translate(calc(var(--tx, 0px) * 0.14), calc(var(--ty, 0px) * 0.14)) rotate(calc(var(--rot, 18deg) * 0.25)) scale(0.97);
      }
      100% {
        transform: translate(0, 0) rotate(0deg) scale(1);
        filter: brightness(1);
      }
    }
    .shuffling-card {
      animation: dynamicShuffle 0.72s cubic-bezier(0.22, 1, 0.36, 1) forwards;
    }
  </style>
</head>
